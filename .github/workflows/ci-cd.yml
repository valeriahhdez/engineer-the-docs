name: Documentation Quality & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permissions required for GitHub Pages deployment and Vale inline annotations
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # Allows Vale to comment/annotate PR lines


# Prevent concurrent deployments from overlapping
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # STEP 1: Quality Gate (Linting & Formatting)
  # -------------------------------------------------------------------
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Fetch documentation files from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: markdownlint quality gate
      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md

      # Placeholder: Ready for when you want to add formatting checks
      # - name: Run Prettier Check
      #   run: echo "Prettier gate will go here"

      # Step 3: Run Vale Prose Linter
      - name: Run Vale
        uses: vale-cli/vale-action@v2
        with:
          version: 3.15.2
          files: 'docs' # Lint docs directory (or use '.' for whole repo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # STEP 2: Build Site & Upload Artifacts
  # -------------------------------------------------------------------
  build:
    needs: lint-and-validate # Ensures linting passes first
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site with Zensical
        run: zensical build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  # -------------------------------------------------------------------
  # STEP 2.5: Consistency Checker Agent
  # Runs in parallel with deploy (both only need `build`) so a flagged
  # terminology issue never blocks a Pages deployment.
  # -------------------------------------------------------------------
  agents:
    name: Consistency Checker Agent
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # Flagged issues exit non-zero; don't fail the workflow over them
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect docs/reference/agents changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'reference/**'
              - 'agents/**'

      - name: Check for fork PR (secrets are withheld by GitHub)
        id: fork-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip - no relevant changes
        if: steps.filter.outputs.docs != 'true'
        run: echo "No changes under docs/, reference/, or agents/ — skipping consistency checker to conserve Groq API calls."

      - name: Skip - fork PR (GROQ_API_KEY unavailable)
        if: steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'true'
        run: echo "Running on a pull request from a fork — GROQ_API_KEY secret is withheld by GitHub. Skipping consistency checker."

      - name: Validate GROQ_API_KEY secret
        if: steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY not configured in GitHub Secrets"
            exit 1
          fi

      - name: Set up Python
        if: steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install agent dependencies
        if: steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agents.txt

      - name: Run consistency checker
        if: steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python agents/run_consistency_checker.py

      # Filenames must match agents.yaml's output.artifact_name
      - name: Post summary to job summary
        if: always() && steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        run: |
          if [ -f agent-qa-report.md ]; then
            cat agent-qa-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JSON report artifact
        if: always() && steps.filter.outputs.docs == 'true' && steps.fork-check.outputs.is_fork_pr == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: agent-qa-report
          path: agent-qa-report.json
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # STEP 3: Deploy to GitHub Pages
  # -------------------------------------------------------------------
  deploy:
    # Only deploy on pushes to main (not on PRs or feature branch pushes)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4