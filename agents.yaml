# agents.yaml - Discovery and Configuration
# Single source of truth for agent orchestration
# PRINCIPLES:
# - Explicit opt-in: only listed files are checked
# - Negation: use ! prefix to exclude patterns
# - Markers: # --no-{agent-name} at file top skips entire file
# - Glossary: per-agent reference data (paths specified here)

agents:
  consistency_checker:
    enabled: true
    description: "Validates terminology against glossary"
    # Two-pass glob: positive patterns first, then negate.
    # Patterns are relative to docs/ root
    sources:
      - "**/*.md"                               # Catch-all: all markdown in docs/
      - "!generated/**/*.md"                    # Exclude auto-generated
    config:
      glossary_path: "reference/glossary.yaml"
      exclude_markers:
        - "# --no-consistency-check"            # Must appear at the top of the file (file-level only)
    
  alt_text_generator:
    enabled: true
    description: "Generates alt text for images missing it"
    # Sources are relative to docs/ root, same two-pass glob as the other agents
    sources:
      - "**/*.md"
    config:
      decorative_paths:              # empty-alt images under these globs are treated as decorative, skipped
        - "assets/icons/**"
      exclude_markers:
        - "# --no-alt-text"
      context_word_cap: 200          # section-bounded context trimmed to this length
    
  seo_optimizer:
    enabled: true
    description: "Validates heading hierarchy and clarity"
    # Sources are relative to docs/ root, same two-pass glob as consistency_checker
    sources:
      - "**/*.md"
      - "!generated/**/*.md"
    config:
      hierarchy_rules:
        require_h1: false                       # Zensical renders frontmatter `title` as H1; body headings start at H2
        allow_h1_skip: false                    # H1 -> H3 (skipping H2) is a violation
        allow_h2_skip: false                    # H2 -> H4 (skipping H3) is a violation
        max_nesting_depth: 4                     # Flag H5/H6 as excessive nesting
      clarity_threshold: 40                     # Score 0-100; below this, Groq flags "low_clarity"
      exclude_markers:
        - "# --no-seo-check"

# Output settings (post-build artifact configuration)
output:
  artifact_name: "agent-qa-report"
  format: "github-actions"                     # Supported: github-action, s3, local
  include_line_numbers: true
  severity_threshold: "info"                   # Report all issues: info, warning, and error

  # Output destinations (will be configured in CI/CD)
  # - JSON artifact upload to GitHub Actions
  # - Markdown summary for manual review
  # - Future: GitHub PR annotations (inline comments)
